name: Complete linked Tasks after merge

on:
  pull_request:
    types: [closed]
    branches: [develop, master]

permissions: {}

concurrency:
  group: task-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  complete-tasks:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out the trusted integration branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Set up the automation runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Complete native Tasks and clean the merged branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/pr_merge_links.py --complete
