name: PR quality gate

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install locked modern tools and runtime
        run: |
          python -m pip install -r requirements/ci.txt
          python -m pip install -c requirements/modern.txt '.[export]'
          python --version
          python -m pip freeze
          python -m pip check
      - name: Run the shared source quality gate
        run: python tools/validate.py --reports ci-reports
      - name: Build sdist and its wheel once and inspect metadata
        run: |
          python -m build
          python -m twine check --strict dist/*
          python tools/release_verify.py --artifacts dist
          cat dist/SHA256SUMS
      - name: Test actual core and export artifacts in clean environments
        run: python tools/release_install.py dist
      - name: Test the installed scalar fuzzy extra in clean environments
        if: matrix.python-version == '3.13'
        run: python tools/release_install.py dist --fuzzy
      - name: Retain build and test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pr-evidence-python-${{ matrix.python-version }}
          path: |
            dist/
            ci-reports/
          if-no-files-found: warn
          retention-days: 14

  windows-installed-smoke:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Build and verify Windows installations
        run: |
          python -m pip install -r requirements/ci.txt
          python -m build
          python tools/release_verify.py --artifacts dist
          python tools/release_install.py dist
