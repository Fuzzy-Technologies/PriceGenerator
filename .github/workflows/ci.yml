name: PR quality gate

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install locked modern tools and runtime
        run: |
          python -m pip install -r requirements/ci.txt
          python -m pip install -c requirements/modern.txt '.[export]'
          python --version
          python -m pip freeze
          python -m pip check
      - name: Compile and lint maintained Python
        run: |
          python -m compileall -q pricegenerator tools tests
          python -m ruff check --select E4,E7,E9,F,D --ignore D202,D203,D213 pricegenerator tools/release_verify.py tools/release_install.py tools/pr_merge_links.py tests/test_packaging.py tests/test_release_contract.py tests/test_pr_merge_links.py
      - name: Test Task lifecycle and deterministic failure paths
        run: |
          python -m pytest -q tests/test_pr_merge_links.py --cov=tools.pr_merge_links --cov-branch --cov-fail-under=95 --cov-report=term-missing --junitxml=ci-reports/lifecycle.xml
      - name: Run complete integration suite
        run: python -m pytest -q tests --junitxml=ci-reports/package-tests.xml
      - name: Build sdist and its wheel once and inspect metadata
        run: |
          python -m build
          python -m twine check --strict dist/*
          python tools/release_verify.py --artifacts dist
          cat dist/SHA256SUMS
      - name: Test actual core and export artifacts in clean environments
        run: python tools/release_install.py dist
      - name: Retain build and test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pr-evidence-python-${{ matrix.python-version }}
          path: |
            dist/
            ci-reports/
          if-no-files-found: warn
          retention-days: 14
