name: Interactive chart runtime gate

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: charts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canvas-and-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: tools/chart_runtime/package-lock.json
      - name: Install exact test and build dependencies without lifecycle scripts
        run: |
          node --version
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/chart_runtime
      - name: Verify the checked-in runtime can be reproduced exactly
        run: |
          npm run build --prefix tools/chart_runtime
          git diff --exit-code -- pricegenerator/rendering/assets/echarts/echarts-financial.min.js pricegenerator/rendering/assets/echarts/build.json
      - name: Execute actual ECharts model and native Canvas export gates
        run: |
          mkdir -p ci-reports
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=ci-reports/chart-runtime.xml tests/javascript/test_interactive_charts.cjs tests/javascript/test_interactive_canvas.cjs
      - name: Retain runtime test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: interactive-chart-runtime-evidence
          path: |
            ci-reports/
            pricegenerator/rendering/assets/echarts/build.json
          if-no-files-found: warn
          retention-days: 14
