  headline: Генератор котировок для тестирования торговых систем
  intro: Задайте начальную цену и волатильность. Полученные свечи можно открыть на графике и сохранить в CSV. Используйте один и тот же файл для отладки индикатора или сгенерируйте несколько ценовых рядов, чтобы сравнить результаты стратегии в своём тестере.
  first_chart: Построить первый график
  compare_paths: Сравнить 32 ценовые траектории
  try: Для каких задач подойдёт PriceGenerator
  command_text: Установите пакет, сгенерируйте 240 часовых свечей и откройте график в браузере. Флаг --analysis добавляет индикаторы. Например, можно наложить полосы Боллинджера или сравнить скользящие средние за 50 и 200 часов.
  terminal: Командная строка
  copy: Скопировать команды
  copied: Команды скопированы.
  chart_alt: Часовые свечи с полосами Боллинджера и двумя скользящими средними. Столбцы под графиком показывают объём.
  cases:
    - {"title": "Проверить импорт CSV", "text": "Загрузите один и тот же файл до и после правки импортёра. Так видно, изменилось ли чтение дат, цен или объёмов.", "path": "quick-start/", "link": "Подготовить тестовый CSV"}
    - {"title": "Проверить индикатор на графике", "text": "Наложите две скользящие средние на свечи. Посмотрите, на какой свече у каждой появляется первое значение.", "path": "reference/#charts", "link": "Включить индикаторы"}
    - {"title": "Проверить торговую стратегию", "text": "Смоделируйте несколько вариантов движения цены и передайте их в свой тестер. Сравните сделки и просадку стратегии на каждом ряду.", "path": "experiments/#monte-carlo", "link": "Получить данные для тестера"}
    - {"title": "Сравнить модель с рынком", "text": "Мы настроили модель по сентябрьским торгам BTC/USD на Bitstamp и проверили её на октябрьских. Средний объём оказался близок к биржевому, но часовые колебания объёма модель не передала.", "path": "experiments/#bitstamp", "link": "Посмотреть результаты по BTC/USD"}
zh-CN:
  name: 简体中文
  home: /zh-CN/
  prefix: /zh-CN/
  company_url: https://fuzzy-technologies.com/zh-cn/
  skip: 跳至正文
  nav: 项目导航
  product: 项目首页
  start: 快速入门
  model: K 线生成原理
  experiments: 实验示例
  release: 2.2.1 版本说明
  languages: 选择语言
  reference: 使用手册
  light: 浅色主题
  dark: 深色主题
  headline: 用模拟行情测试交易系统
  intro: 设定起始价和波动率，PriceGenerator 就能生成一段 K 线行情，供你在浏览器里看图或导出 CSV。调试指标时可以反复使用同一份数据，检验策略时则可以换几种走势，比较回测结果。
  first_chart: 画出第一张 K 线图
  compare_paths: 对比 32 条模拟走势
  try: 可以用来做什么？
  command_text: 运行下面三条命令，安装软件包，生成 240 根 1 小时 K 线，并在浏览器中打开图表。加上 --analysis 即可查看布林带，也可以叠加 50 小时和 200 小时均线。
  terminal: 命令行
  copy: 复制命令
  copied: 命令已复制。
  chart_alt: 小时 K 线图上叠加了布林带和两条均线，下方的柱状图显示各小时的模拟成交量。
  cases:
    - {"title": "测试行情导入程序", "text": "修改程序前后分别导入同一份 CSV，核对时间、价格和成交量，检查读取结果是否一致。", "path": "quick-start/", "link": "生成测试用的 CSV"}
    - {"title": "核对技术指标", "text": "在同一张 K 线图上叠加两条均线，检查各自从哪根 K 线开始有值。", "path": "reference/#charts", "link": "查看指标设置"}
    - {"title": "比较不同走势下的策略表现", "text": "按同一组参数生成多段行情，分别放进自己的回测程序，比较每次的交易记录和策略回撤。", "path": "experiments/#monte-carlo", "link": "生成多组回测数据"}
    - {"title": "对照真实行情", "text": "用 Bitstamp 的 9 月 BTC/USD 行情估计参数，再用 10 月行情检验。模拟的小时平均成交量接近实际值，但没有反映出成交量逐小时的起伏。", "path": "experiments/#bitstamp", "link": "查看 BTC/USD 实验结果"}
